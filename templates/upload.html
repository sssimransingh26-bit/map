<!DOCTYPE html>
<html>
<head>
    <title>Image Geolocation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
        min-height: 100vh;
    }
    .card {
        border-radius: 20px;
    }
    button {
        transition: 0.3s;
    }
    button:hover {
        transform: scale(1.02);
    }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container py-5">
    <a class="navbar-brand" href="/">Image Geolocation</a>
  </div>
</nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg border-0">
                <div class="card-body">
                    <h3 class="card-title mb-4  text-center">
                        <i class="bi bi-geo-alt-fill"></i>
                         Upload Photo</h3>
                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input type="file" name="file" accept="image/*" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Upload & Find Location</button>
                    </form>
                    {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
                </div>
            </div>
            <footer class="mt-5 text-center text-muted">
                <small>&copy; {{ current_year }} Geolocation Demo</small>
            </footer>
        </div>
    </div>
</div>
</body>
</html>
